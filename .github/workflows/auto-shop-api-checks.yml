name: AUTO SHOP PRO API Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - '.github/workflows/auto-shop-api-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js
